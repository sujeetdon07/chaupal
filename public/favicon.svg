<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a382c"/>
      <stop offset="100%" stop-color="#141a15"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5ead4"/>
      <stop offset="100%" stop-color="#d7a75c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="28" stroke="#d7a75c" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
  <!-- Radio Antenna -->
  <line x1="20" y1="24" x2="14" y2="12" stroke="#d7a75c" stroke-width="2" stroke-linecap="round"/>
  <circle cx="14" cy="12" r="2" fill="#efc579"/>
  <!-- Radio Body -->
  <rect x="14" y="24" width="36" height="26" rx="6" fill="#20261d" stroke="#d7a75c" stroke-width="2"/>
  <!-- Speaker Grill -->
  <circle cx="26" cy="37" r="7" fill="#182019" stroke="#d7a75c" stroke-width="1.5"/>
  <circle cx="26" cy="37" r="3" fill="#d7a75c"/>
  <!-- Dial / Display -->
  <rect x="37" y="28" width="9" height="5" rx="1.5" fill="#efc579" fill-opacity="0.8"/>
  <circle cx="41.5" cy="40" r="3" fill="#8d5b3b" stroke="#d7a75c" stroke-width="1"/>
</svg>
